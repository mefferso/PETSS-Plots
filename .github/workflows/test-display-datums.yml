name: Test display datums
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test observation acquisition
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test display conversion and chart inputs
        run: node --test tests/*.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Render both pages with real chart libraries
        run: node tests/browser-smoke.js
