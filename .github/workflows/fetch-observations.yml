name: Fetch observation-only water levels
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: ['feat/observation-only-stations']
    paths:
      - scripts/fetch_observations.py
      - .github/workflows/fetch-observations.yml
permissions:
  contents: write
concurrency:
  group: observation-water-levels-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch observed water levels independently of PETSS archives
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_observations.py
      - name: Commit observations and retrieval status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/observations
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update observation-only water levels'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
      - name: Report complete source outage
        if: steps.fetch.outcome == 'failure'
        run: exit 1
